<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Detrás del API Gateway la app vive en .../web/. Sin la barra final, las rutas relativas
         de los assets no resolverían: se corrige antes de cargar nada. -->
    <script>
      if (/\/web$/.test(location.pathname)) location.replace(location.pathname + "/" + location.search);
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05080c" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>AegisVolt</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
