# Solo para docker compose (tests E2E de navegador y desarrollo local): reproduce el layout del
# API Gateway => la app en /web/ y GraphQL en /graphql del MISMO origen.
server {
  listen 8080;
  server_name _;

  location = /healthz { access_log off; return 200 "ok\n"; }
  location = / { return 302 /web/; }
  location = /web { return 301 /web/; }

  location /web/ {
    alias /usr/share/nginx/html/;
    try_files $uri $uri/ /web/index.html;
  }

  location /graphql {
    proxy_pass http://graphql-gateway:8080/graphql;
    proxy_set_header Host $host;
  }
}
