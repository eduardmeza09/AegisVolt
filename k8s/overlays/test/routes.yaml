# Rutas del ambiente test en Traefik (NodePort 30080): /test/<servicio>/... -> TraefikService ponderado.
# El API Gateway de test apunta a /test/graphql-gateway; los servicios internos se llaman igual.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-env-prefix
spec:
  stripPrefixRegex:
    regex: ["^/test/[a-z-]+"]
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: aegisvolt
spec:
  entryPoints: [web]
  routes:
    - kind: Rule
      match: PathPrefix(`/test/graphql-gateway`)
      middlewares: [{ name: strip-env-prefix }]
      services: [{ name: graphql-gateway, kind: TraefikService }]
    - kind: Rule
      match: PathPrefix(`/test/station-reservation`)
      middlewares: [{ name: strip-env-prefix }]
      services: [{ name: station-reservation, kind: TraefikService }]
    - kind: Rule
      match: PathPrefix(`/test/billing-wallet`)
      middlewares: [{ name: strip-env-prefix }]
      services: [{ name: billing-wallet, kind: TraefikService }]
    - kind: Rule
      match: PathPrefix(`/test/energy-dispatch`)
      middlewares: [{ name: strip-env-prefix }]
      services: [{ name: energy-dispatch, kind: TraefikService }]
