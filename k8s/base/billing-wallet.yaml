# billing-wallet: Rollout canary + Services stable/canary + TraefikService ponderado (Argo Rollouts ajusta los pesos)
apiVersion: v1
kind: Service
metadata:
  name: billing-wallet-stable
  labels: { app: billing-wallet, aegisvolt.io/track: stable }
spec:
  selector: { app: billing-wallet }
  ports: [{ name: http, port: 80, targetPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata:
  name: billing-wallet-canary
  labels: { app: billing-wallet, aegisvolt.io/track: canary }
spec:
  selector: { app: billing-wallet }
  ports: [{ name: http, port: 80, targetPort: 8080 }]
---
apiVersion: traefik.io/v1alpha1
kind: TraefikService
metadata:
  name: billing-wallet
spec:
  weighted:
    services:
      - { name: billing-wallet-stable, port: 80, weight: 100 }
      - { name: billing-wallet-canary, port: 80, weight: 0 }
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: billing-wallet
  labels: { app: billing-wallet, app.kubernetes.io/part-of: aegisvolt }
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels: { app: billing-wallet }
  template:
    metadata:
      labels: { app: billing-wallet, app.kubernetes.io/part-of: aegisvolt }
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: app
          image: aegisvolt/billing-wallet:IMAGE_TAG
          imagePullPolicy: Never   # imagen importada en el containerd de k3s (ver scripts/deploy.sh)
          ports: [{ name: http, containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: aegisvolt-config }
            - secretRef: { name: aegisvolt-admin }
          env:
            - { name: SERVICE_NAME, value: billing-wallet }
            - { name: AWS_ACCESS_KEY_ID, value: test }
            - { name: AWS_SECRET_ACCESS_KEY, value: test }
            - { name: FAULT_INJECTION_RATE, value: "0" }
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_TEMPLATE_HASH   # dimensión de las métricas => el canary se mide por separado
              valueFrom: { fieldRef: { fieldPath: "metadata.labels['rollouts-pod-template-hash']" } }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 80Mi }
            limits: { memory: 160Mi }
  strategy:
    canary:
      canaryService: billing-wallet-canary
      stableService: billing-wallet-stable
      trafficRouting:
        traefik:
          weightedTraefikServiceName: billing-wallet
      steps:
        - setWeight: 20            # 20 % del tráfico a la versión nueva, 80 % sigue en la estable
        - pause: { duration: 15s }
        - analysis:
            templates: [{ templateName: canary-error-rate }]
            args:
              - { name: service, value: billing-wallet }
              - name: canary-hash
                valueFrom: { podTemplateHashValue: Latest }
        - setWeight: 50
        - pause: { duration: 10s }
        - analysis:
            templates: [{ templateName: canary-error-rate }]
            args:
              - { name: service, value: billing-wallet }
              - name: canary-hash
                valueFrom: { podTemplateHashValue: Latest }
        - setWeight: 100
